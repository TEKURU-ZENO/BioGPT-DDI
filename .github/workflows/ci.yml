name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r requirements-dev.txt
      - name: Clinical regression + API tests
        run: python -m pytest -q
        env:
          DDI_ENABLE_RXNAV: "false"
      - name: Gold-standard evaluation (fails if safety-critical recall < 100%)
        run: python -m scripts.evaluate --out eval-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r research/requirements.txt -r requirements-dev.txt
      - name: Learned-layer pipeline tests
        run: python -m pytest -q tests/test_learned.py
        env:
          DDI_ENABLE_RXNAV: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Build (warnings are errors)
        run: npm run build
        env:
          CI: "true"
